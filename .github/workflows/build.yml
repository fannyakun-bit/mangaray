name: Build APK
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MIHON_GITHUB_RELEASE=true" >> "$GITHUB_ENV"
          echo "storeFile=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "storePassword=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "keyAlias=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "keyPassword=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build app
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false -Penable-updater=false

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaray-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
