name: Unzip project

# Upload zip (patch atau full) ke root repo, atau jalankan manual dari tab Actions.
# Isi zip di-OVERLAY ke repo: file yang ada di zip menimpa yang lama,
# file lain TIDAK dihapus (aman untuk zip patch berisi file yang berubah saja).
on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Tidak ada file .zip di root repo"
            exit 1
          fi
          echo "Extract: $ZIP"
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q "$ZIP" -d /tmp/unz

          # Kalau isinya cuma 1 folder (mangaray-main/), pakai isi folder itu
          SRC=/tmp/unz
          if [ "$(ls -A /tmp/unz | wc -l)" = "1" ] && [ -d "$(ls -d /tmp/unz/* | head -n 1)" ]; then
            SRC=$(ls -d /tmp/unz/* | head -n 1)
          fi

          # Token tidak boleh ubah .github/workflows
          rm -rf "$SRC/.github/workflows"

          # Overlay tanpa --delete
          rsync -a --exclude '.git' --exclude "$ZIP" "$SRC"/ ./
          rm -f "$ZIP"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Update project dari zip"
            git push
          fi
