name: Unzip

# Taruh file ini di .github/workflows/unzip.yml
# Upload webtoon-ui.zip ke root repo, lalu jalankan workflow ini dari tab Actions.
on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Nama file zip di root repo"
        required: true
        default: "webtoon-ui.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip (timpa file lama)
        run: |
          test -f "${{ inputs.zip_file }}" || { echo "File tidak ketemu"; exit 1; }
          unzip -o "${{ inputs.zip_file }}"
          rm "${{ inputs.zip_file }}"

      - name: Commit dan push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Apply Webtoon-style UI"
          git push
