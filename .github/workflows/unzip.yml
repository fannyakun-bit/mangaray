name: Unzip project

# Upload mangaray-main.zip ke root repo (atau jalankan manual dari tab Actions),
# workflow ini extract isinya ke root repo lalu commit hasilnya.
on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Tidak ada file .zip di root repo"
            exit 1
          fi
          echo "Extract: $ZIP"
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q "$ZIP" -d /tmp/unz

          # Kalau isinya cuma 1 folder (mangaray-main/), pakai isi folder itu
          SRC=/tmp/unz
          if [ "$(ls -A /tmp/unz | wc -l)" = "1" ] && [ -d "$(ls -d /tmp/unz/* | head -n 1)" ]; then
            SRC=$(ls -d /tmp/unz/* | head -n 1)
          fi

          # Jangan timpa workflow yang lagi jalan (token tidak boleh ubah .github/workflows)
          rm -rf "$SRC/.github/workflows"

          # Salin ke root repo (file lama di-overwrite, file yang dihapus di zip ikut dihapus)
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude "$ZIP" \
            "$SRC"/ ./
          # Sisa .github dari zip (selain workflows) kalau ada
          if [ -d "$SRC/.github" ]; then
            rsync -a "$SRC/.github"/ ./.github/
          fi
          rm -f "$ZIP"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Update project dari zip"
            git push
          fi
